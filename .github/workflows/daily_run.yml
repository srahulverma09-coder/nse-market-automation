name: Daily Market Top 10 Report

on:
  schedule:
    # Runs everyday at 12:30 UTC (6:00 PM IST) Monday to Friday
    - cron: '30 12 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance openpyxl requests

      - name: Run Market Report Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python market_report.py

      - name: Upload Daily Market Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Market-Report
          path: "*.xlsx"
