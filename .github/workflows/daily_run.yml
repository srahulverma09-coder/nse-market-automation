name: Daily Market Top 10 Report

on:
  schedule:
    # Runs everyday at 12:30 UTC (6:00 PM IST) Monday to Friday
    - cron: '30 12 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas yfinance openpyxl google-api-python-client google-auth

      - name: Run Market Report Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python market_report.py
      
